name: Mineflayer Bot 24/7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    name: Start Bot
    runs-on: ubuntu-latest
    timeout-minutes: 9999  # Asla zaman aşımına uğramasın

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v3

      - name: Node.js kur
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Botu çalıştır (Sonsuz Döngü + Otomatik Yeniden Başlatma)
        run: |
          echo "Bot başlıyor..."
          while true
          do
            node index.js
            echo "Bot çöktü! 2 dakika sonra yeniden başlatılacak..."
            sleep 120   # 2 dakika bekle → Senin isteğin
          done


